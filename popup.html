<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        <span class="logo-text">Clarity</span>
      </div>
      <label class="toggle" title="Enable / disable">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div class="stat-row">
      <div class="stat-block">
        <span class="stat-value" id="hiddenCount">—</span>
        <span class="stat-label">hidden this session</span>
      </div>
      <div class="stat-block">
        <span class="stat-value" id="ruleCount">120</span>
        <span class="stat-label">network rules</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="scanNow">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
        </svg>
        Scan page now
      </button>

      <button class="btn btn-outline" id="pickerBtn">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/>
        </svg>
        Pick element to hide
      </button>
    </div>

    <div class="custom-rules-row" id="customRulesRow" style="display:none">
      <span id="customRulesLabel"></span>
      <button class="btn-link" id="clearRules">clear</button>
    </div>

    <footer>Blocking ads at network · connection · feed · DOM</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
